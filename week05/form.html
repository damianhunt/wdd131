<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Damian Hunt's Assignment for W05 Assignment: Product Review Form. 
    This form allows users to submit a review for a product, including a rating, features they found useful, and an optional written review.">
    <meta name="author" content="Damian Hunt">
    <title>W05 Assignment: Product Review Form - Damian Hunt</title>

    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-large.css">
    <script src="scripts/form.js" defer></script>

</head>

<body>
    <header id="page-title">Product Review</header>

    <main>


        <form method="get" action="review.html" class="review">
        
        <fieldset>
            <legend>Product Information</legend>
            <fieldset>
            <label for="product-name"> Product Name</label>
                <select id="product-name" name="product" required>
                <option value="" disabled selected>Select a Product &#9662;</option>                    
                </select>
            </fieldset>
        
        <fieldset>
            
            <div>Overall Rating</div>
            <div class="rating">
                    <input type="radio" id="fivestar" name="rating" value="5" required>
                    <label for="fivestar"></label>

                    <input type="radio" id="fourstar" name="rating" value="4" required>
                    <label for="fourstar"></label>

                    <input type="radio" id="threestar" name="rating" value="3" required>
                    <label for="threestar"></label>

                    <input type="radio" id="twostar" name="rating" value="2" required>
                    <label for="twostar"></label>
                    
                    <input type="radio" id="onestar" name="rating" value="1" required>
                    <label for="onestar"></label>
                    
                </div>
        </fieldset>
            
        <fieldset>
        
        <label for="completed-date">Date of Installation</label>
        <input type="date" id="completed-date" name="completed-date" required>

        <div>Which Features did you find useful in the product?</div>
            <label>Check all that apply</label>

            <label for="durability">Durability</label>
            <input type="checkbox" id="durability" name="features" value="durability">
            
            <label for="ease">Ease of Use</label>
            <input type="checkbox" id="ease" name="features" value="ease">
            
            <label for="performance">Performance</label>
            <input type="checkbox" id="performance" name="features" value="performance">
            
            <label for="design">Design</label>
            <input type="checkbox" id="design" name="features" value="design">
        </fieldset>

        <fieldset>
        <label for="review">Written Review <span>(Optional)</span></label>
        <textarea name="review" id="review" rows="4" cols="50"></textarea>

        <label for="user-name">Your Name <span >(Optional)</span>:</label>
        <input type="text" id="user-name" name="name">
        </fieldset>

        <input type="submit" value="Post Review">
        </fieldset>
    </form>
    </main>

    <footer>
        <p>
            &copy;<span id="year"></span>| Damian Hunt | South Africa<br>  
            Last Modified:<span id="lastModified"></span><br>
        </p>
    </footer>
</body>
</html>
